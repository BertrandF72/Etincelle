<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --paper:#FDFBF7; --paper-2:#F5EDE6; --card:#FFFFFF; --ink:#2E2A28; --ink-soft:#6B6058; --ink-faint:#A69C92;
    --line:#E8DDD3; --spark:#F2A9A0; --spark-soft:#FBE3DE; --good:#8FD9C4; --spark-contrast:#4A140D; --accent2:#C9B8F0;
    --radius-card: 16px; --shadow-card: 0 1px 0 rgba(46,42,40,.05), 0 8px 20px -12px rgba(46,42,40,.18);
    box-sizing:border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#1F1918; --paper-2:#2A211F; --card:#26201D; --ink:#F2EAE7; --ink-soft:#C9BDB6; --ink-faint:#8A7D76;
    --line:#3A2E2A; --spark:#EDA79C; --spark-soft:#3E2620; --good:#7FE0C8; --spark-contrast:#3E0F09; --accent2:#B79EF2; } }
  :root[data-theme="dark"]{
    --paper:#1F1918; --paper-2:#2A211F; --card:#26201D; --ink:#F2EAE7; --ink-soft:#C9BDB6; --ink-faint:#8A7D76;
    --line:#3A2E2A; --spark:#EDA79C; --spark-soft:#3E2620; --good:#7FE0C8; --spark-contrast:#3E0F09; --accent2:#B79EF2; }
  html,body{height:100%;} *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing:antialiased; min-height:100%; }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; font-weight:500; letter-spacing:-0.01em; margin:0; }
  ::selection{ background:var(--spark-soft); }
  button{ font-family:inherit; } textarea, input[type=text]{ font-family:inherit; }

  .app{ max-width:760px; margin:0 auto; padding:16px 16px 90px; min-height:100%; }

  .banner{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--paper); padding:10px 0 8px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .banner-row{ display:flex; align-items:center; gap:10px; }
  .banner .brand{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; color:var(--spark); white-space:nowrap; }
  .banner .question{ font-size:13.5px; line-height:1.3; color:var(--ink-soft); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .banner .question.expanded{ white-space:normal; overflow:visible; text-overflow:clip; }
  .banner .question b{ color:var(--ink); font-weight:600; }
  .banner .home-btn{ border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:12px; padding:2px 0; text-decoration:underline; text-underline-offset:2px; flex:none; }
  .phase-pills{ display:flex; gap:6px; margin-top:8px; }
  .phase-pill{ flex:1; text-align:center; padding:5px 4px; border-radius:7px; font-size:10.5px; font-weight:700; background:var(--paper-2); color:var(--ink-faint); border:1px solid var(--line); letter-spacing:.01em; }
  .phase-pill.active{ background:var(--spark); color:var(--spark-contrast); border-color:var(--spark); }
  .phase-pill.done{ background:var(--accent2); color:#2E2245; border-color:var(--accent2); }

  .stage-label{ font-size:12px; color:var(--spark); font-weight:600; letter-spacing:.01em; margin-bottom:4px; }
  h1.title{ font-size:23px; margin-bottom:5px; }
  .stage-icon{ display:inline-flex; vertical-align:-6px; margin-right:8px; color:var(--ink); }
  p.lede{ color:var(--ink-soft); font-size:14px; line-height:1.45; margin:0 0 14px; max-width:56ch; }

  /* fixed bottom action bar */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--paper); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    max-width:760px; margin:0 auto;
  }
  .bottombar .spacer{ flex:1; }
  .bottombar .btn{ padding:10px 14px; font-size:13.5px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:16px; }
  .example-box{ font-size:13.5px; font-style:italic; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px; padding:10px 14px; margin-bottom:18px; }

  .field{ margin-bottom:16px; } .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .input-row{ display:flex; gap:8px; align-items:flex-start; }
  textarea, input[type=text]{ width:100%; border:1px solid var(--line); border-radius:10px; background:var(--paper-2); color:var(--ink); padding:11px 12px; font-size:15px; line-height:1.4; resize:vertical; }
  textarea:focus, input[type=text]:focus{ outline:2px solid var(--spark); outline-offset:1px; }

  .btn{ display:inline-flex; align-items:center; gap:8px; justify-content:center; border:1px solid transparent; border-radius:10px; padding:11px 18px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Space Grotesk', sans-serif; transition:transform .1s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--ink); color:var(--paper); } .btn-primary:hover{ opacity:.9; }
  .btn-spark{ background:var(--spark); color:var(--spark-contrast); } .btn-spark:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); } .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-mic{ width:44px; height:44px; border-radius:10px; flex:none; padding:0; background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .btn-mic.listening{ background:var(--spark); color:var(--spark-contrast); border-color:var(--spark); animation:pulse-mic 1.1s ease-in-out infinite; }
  @keyframes pulse-mic{ 0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.35);} 50%{box-shadow:0 0 0 8px rgba(0,0,0,0);} }
  .btn-mic.mic-error{ background:var(--paper-2); border-color:var(--ink); border-width:2px; color:var(--ink); animation:none; }
  .mic-note{ font-size:12.5px; color:var(--ink); font-weight:600; margin-top:6px; }

  .actions{ display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; align-items:center; }
  .actions-wheel{ justify-content:space-between; }
  .actions .spacer{ flex:1; }
  .hint{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; }

  .session-item{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:var(--card); }
  .session-item .meta{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .session-item .name{ font-family:'Space Grotesk',sans-serif; font-size:16px; }
  .session-item button{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; text-decoration:underline; text-underline-offset:2px; }

  .hub-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .hub-card{ position:relative; border:1px solid var(--line); border-radius:14px; padding:14px 8px; background:var(--card); display:flex; flex-direction:column; gap:4px; align-items:center; text-align:center; cursor:pointer; transition:border-color .15s ease, transform .1s ease; }
  .hub-badge-count{ position:absolute; top:6px; right:6px; min-width:18px; height:18px; padding:0 4px; border-radius:100px; background:var(--ink); color:var(--paper); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .hub-card:hover{ border-color:var(--spark); }
  .hub-card.level-selected{ border-color:var(--accent2); border-width:2px; background:var(--paper-2); }
  .hub-card:active{ transform:scale(.98); }
  .hub-card h3{ font-size:16px; }
  .hub-icon{ color:var(--ink); }
  @media (max-width:520px){ .hub-grid{ grid-template-columns:1fr; } .hub-card{ flex-direction:row; justify-content:space-between; text-align:left; } }

  .wheel-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; }
  .wheel-shell{ position:relative; width:min(320px, 78vw); height:min(320px, 78vw); cursor:pointer; }
  .wheel-pointer{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0;height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:16px solid var(--spark); z-index:5; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .wheel-disc{ width:100%; height:100%; transition:none; }
  .wheel-disc.spinning{ transition: transform 3.2s cubic-bezier(.17,.67,.16,1.01); }
  .wheel-disc svg{ width:100%; height:100%; display:block; }
  .just-picked{ animation: seg-flash 1.2s ease; }
  @keyframes seg-flash{ 0%{ fill:var(--spark); } 100%{ fill:var(--spark-soft); } }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip{ background:var(--paper-2); border:1px solid var(--line); border-radius:100px; padding:6px 13px; font-size:13px; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .chip .dot{ width:6px;height:6px;border-radius:50%; background:var(--spark); }

  .deck-area{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:8px; }
  .deck-stack{ position:relative; width:150px; height:212px; cursor:pointer; }
  .deck-back{ position:absolute; inset:0; border-radius:14px; background:var(--ink); border:1px solid var(--line); }
  .deck-back:nth-of-type(1){ transform:translate(7px,7px) rotate(3deg); z-index:1; }
  .deck-back:nth-of-type(2){ transform:translate(13px,12px) rotate(-3deg); z-index:0; }
  .deck-back:nth-of-type(3){ transform:translate(-6px,10px) rotate(-5deg); z-index:0; }
  .deck-stack.shuffling{ animation: shuffle-wiggle .62s ease-in-out; }
  @keyframes shuffle-wiggle{ 0%{transform:translateX(0) rotate(0);} 20%{transform:translateX(-10px) rotate(-5deg);} 40%{transform:translateX(9px) rotate(4deg);} 60%{transform:translateX(-7px) rotate(-3deg);} 80%{transform:translateX(6px) rotate(2deg);} 100%{transform:translateX(0) rotate(0);} }
  .deck-top{ position:absolute; inset:0; perspective:900px; z-index:2; }
  .deck-top-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); }
  .deck-top.flipped .deck-top-inner{ transform:rotateY(180deg); }
  .deck-face{ position:absolute; inset:0; border-radius:14px; backface-visibility:hidden; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .deck-face-back{ background:var(--ink); } .deck-face-back svg{ width:34%; color:var(--spark-soft); }
  .deck-face-front{ background:var(--card); transform:rotateY(180deg); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:21px; text-align:center; padding:10px; color:var(--ink); }
  .deck-count{ font-size:13px; color:var(--ink-faint); }

  .draw-panel{ margin-top:14px; }
  .draw-sub{ color:var(--ink-soft); font-size:14px; margin-bottom:12px; text-align:center; }
  .idea-log{ margin-top:18px; } .idea-log .entry{ padding:9px 0; border-top:1px solid var(--line); font-size:14px; } .idea-log .entry .w{ color:var(--spark); font-weight:600; }

  .mindmap-svg{ display:block; width:auto; height:auto; max-width:100%; max-height:220px; margin:0 auto 4px; transition:max-height .25s ease; }
  .mindmap-svg.mm-expanded{ max-height:640px; }
  .mm-expand-btn{ display:block; margin:0 auto 12px; background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .mm-line{ stroke:var(--line); stroke-width:2; }
  .mm-node-center circle{ fill:var(--ink); } .mm-node-center text{ fill:var(--paper); }
  .mm-node-branch circle{ fill:var(--card); stroke:var(--ink-soft); stroke-width:1.5; } .mm-node-branch text{ fill:var(--ink); font-weight:600; }
  .mm-node-leaf circle{ fill:var(--paper-2); stroke:var(--line); stroke-width:1.5; }
  .mm-node-leaf{ cursor:pointer; }
  .mm-node-leaf:hover circle{ stroke:var(--ink); stroke-width:2.5; }
  .mm-node-leaf text{ fill:var(--ink-soft); paint-order:stroke; stroke:var(--card); stroke-width:4px; stroke-linejoin:round; }
  .mm-node-leaf.active circle{ fill:var(--spark); stroke:var(--spark); } .mm-node-leaf.active text{ fill:var(--spark-contrast); font-weight:700; stroke:var(--spark); }
  .mm-node-leaf.done circle{ fill:var(--good); stroke:var(--good); opacity:.35; }
  text{ font-family:'Space Grotesk',sans-serif; font-size:11px; }

  .question-reminder{ font-family:'Space Grotesk',sans-serif; font-size:16px; line-height:1.4; color:var(--ink); background:var(--paper-2); border-left:3px solid var(--spark); padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  .encourage{ display:inline-block; background:var(--spark-soft); color:var(--ink); border-radius:100px; padding:6px 14px; font-size:13px; margin-bottom:14px; }

  .timer-wrap{ display:flex; align-items:center; justify-content:center; margin:6px 0 18px; }
  .timer-ring{ position:relative; width:96px; height:96px; } .timer-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring circle{ fill:none; stroke-width:6; } .timer-bg{ stroke:var(--line); }
  .timer-fg{ stroke:var(--spark); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .timer-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:26px; }
  .speed-row{ display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .speed-btn{ border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); border-radius:100px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .speed-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .nudge{ font-size:13px; color:var(--ink); background:var(--spark-soft); padding:9px 14px; border-radius:10px; margin:4px 0 4px; text-align:center; }
  .nudge-pulse{ animation: nudge-glow 1.2s ease-in-out infinite; }
  @keyframes nudge-glow{ 0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,.35); } 50%{ box-shadow:0 0 0 7px rgba(0,0,0,0); } }

  .debrief-group{ margin-bottom:22px; } .debrief-group h3{ font-size:15px; color:var(--spark); margin-bottom:10px; }
  .debrief-row{ display:flex; gap:10px; align-items:center; padding:12px 4px; border-top:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .debrief-row .mark{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--paper); }
  .debrief-row.kept .mark{ background:var(--ink); border-color:var(--ink); }
  .debrief-row.kept .mark::after{ content:'✓'; }
  .debrief-row:not(.kept) .txt{ color:var(--ink-faint); text-decoration:line-through; }
  .debrief-row .txt{ font-size:14px; line-height:1.35; }

  .synth-col{ margin-bottom:20px; } .synth-col h3{ font-size:14px; color:var(--ink-soft); margin-bottom:8px; font-weight:600; }
  .synth-bullet{ font-size:14.5px; line-height:1.5; padding:7px 0 7px 16px; position:relative; }
  .synth-bullet::before{ content:'—'; position:absolute; left:0; color:var(--spark); }
  .ai-box{ margin-top:24px; padding:18px; background:var(--paper-2); border-radius:14px; border:1px solid var(--line); }
  .ai-box .lbl{ font-size:12.5px; color:var(--spark); font-weight:600; margin-bottom:8px; }
  .ai-out{ font-size:14.5px; line-height:1.6; white-space:pre-wrap; }

  .empty{ color:var(--ink-faint); font-size:14px; font-style:italic; padding:20px 0; }
  @media (max-width:480px){
    h1.title{ font-size:20px; }
    .card{ padding:12px; }
    .deck-stack{ width:120px; height:170px; }
    .wheel-shell{ width:min(220px, 62vw); height:min(220px, 62vw); }
  }
</style>

  function micButton(targetId){ return ''; }
  function micNoteId(id){ return 'micnote-'+id; }
  function showMicNote(btn, targetId, message){
    var row = btn.closest ? btn.closest('.input-row') : btn.parentElement;
    if(!row) return;
    var note = document.getElementById(micNoteId(targetId));
    if(!note){ note=document.createElement('div'); note.className='mic-note'; note.id=micNoteId(targetId); row.insertAdjacentElement('afterend', note); }
    note.textContent = message;
  }
  function clearMicNote(id){ var n=document.getElementById(micNoteId(id)); if(n) n.remove(); }
  function wireMic(container){
    if(!SpeechRec) return;
    container.querySelectorAll('[data-mic]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var targetId = btn.getAttribute('data-mic');
        var field = document.getElementById(targetId);
        if(!field) return;
        if(activeRec && activeMicBtn===btn){ stopActiveRec(); btn.classList.remove('listening'); return; }
        if(activeRec) stopActiveRec();
        clearMicNote(targetId);
        startRecognition(field, btn, targetId);
      });
    });
  }
  function startRecognition(field, btn, targetId){
    micUserStopped = false;
    var rec; try{ rec = new SpeechRec(); }catch(e){ showMicNote(btn, targetId, "Reconnaissance vocale indisponible ici — utilise le clavier."); return; }
    rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true;
    var baseValue = field.value ? field.value.replace(/\s+$/,'')+' ' : '';
    var finalTxt = '';
    rec.onstart = function(){ clearMicNote(targetId); btn.classList.remove('mic-error'); };
    rec.onresult = function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){ var t=e.results[i][0].transcript; if(e.results[i].isFinal) finalTxt+=t+' '; else interim+=t; }
      field.value = (baseValue+finalTxt+interim).replace(/[ \t]+/g,' ');
      field.dispatchEvent(new Event('input'));
    };
    rec.onerror = function(err){
      console.warn('Dictée — erreur SpeechRecognition:', err.error);
      var msg;
      if(err.error==='not-allowed'||err.error==='service-not-allowed'){ msg="Micro refusé ou bloqué ici (permission navigateur) — utilise le clavier."; micUserStopped=true; }
      else if(err.error==='audio-capture'){ msg="Aucun micro détecté — utilise le clavier."; micUserStopped=true; }
      else if(err.error==='no-speech'){ msg=''; }
      else if(err.error==='network'){ msg="Dictée indisponible hors connexion ou réseau instable."; micUserStopped=true; }
      else { msg="Erreur de dictée ("+err.error+") — utilise le clavier."; micUserStopped=true; }
      if(msg){ btn.classList.add('mic-error'); showMicNote(btn, targetId, msg); }
    };
    rec.onend = function(){
      if(!micUserStopped){ baseValue = field.value ? field.value.replace(/\s+$/,'')+' ' : ''; finalTxt=''; try{ rec.start(); return; }catch(e){} }
      btn.classList.remove('listening'); if(activeRec===rec){ activeRec=null; activeMicBtn=null; }
    };
    activeRec = rec; activeMicBtn = btn; btn.classList.add('listening');
    try{ rec.start(); }
    catch(e){ btn.classList.remove('listening'); btn.classList.add('mic-error'); showMicNote(btn, targetId, "Impossible de démarrer le micro ici."); activeRec=null; activeMicBtn=null; }
  }

    regenBtn.addEventListener('click', function(){ if(!subj.value.trim()) return; quest.value=pickQuestion(subj.value); s.question=quest.value; saveStore(); refresh(); });
    refresh();
    nextBtn.addEventListener('click', function(){ s.stage='hub'; persist(); });
  }

  /* ============ HUB (Phase 1 · Divergence) ============ */
  function ex1IdeaCount(s){ var c=0; s.ex1Branches.forEach(function(b){ b.leaves.forEach(function(l){ c+=l.ideas.length; }); }); return c; }
  function hubCard(iconName, title, count, btnId){
    return '<div class="hub-card" id="'+btnId+'" role="button" tabindex="0">'
      + (count>0 ? '<div class="hub-badge-count">'+count+'</div>' : '')
      + '<div class="hub-icon">'+iconSVG(iconName)+'</div><h3>'+esc(title)+'</h3></div>';
  }
  function viewHub(s){
    var e1=ex1IdeaCount(s), e2=s.cardIdeas.length, e3=s.wheelIdeas.length, total=e1+e2+e3;
    return '<div class="stage-label">Phase 1 · Divergence</div>'
      + '<h1 class="title">Choisis une ou plusieurs séquences créatives</h1>'
      + '<div class="hub-grid">'
      + hubCard('mindmap', 'Exploration mentale', e1, 'go-ex1')
      + hubCard('cards', 'Hasards féconds', e2, 'go-ex2')
      + hubCard('wheel', 'Refonte du présent', e3, 'go-ex3')
      + '</div>'
      + (total ? '<div class="hint" style="margin-bottom:10px;">'+total+' idée(s) émise(s) au total.</div>' : '')
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="go-convergence">Passer à la convergence →</button></div>';
  }
  function wireHub(s){
    document.getElementById('go-ex1').addEventListener('click', function(){
      if(!s.ex1Branches.length){ s.stage='ex1-l1'; }
      else if(!s.ex1WarmupDone){ s.stage='ex1-warmup'; }
      else {
        var incompleteIdx = s.ex1Branches.findIndex(function(b){ return !b.leaves.length; });
        if(incompleteIdx>-1){ s.stage='ex1-l2'; s.ex1FillPos = incompleteIdx; }
        else if(s.ex1DictateQueue.length && s.ex1DictatePos<s.ex1DictateQueue.length){ s.stage='ex1-dictate'; }
        else { s.stage='ex1-l1'; }
      }
      persist();
    });
    document.getElementById('go-ex2').addEventListener('click', function(){ s.stage='ex2-cards'; persist(); });
    document.getElementById('go-ex3').addEventListener('click', function(){ s.stage='ex3-wheel'; persist(); });
    document.getElementById('go-convergence').addEventListener('click', function(){ s.stage='convergence'; persist(); });
    root.querySelectorAll('.hub-card').forEach(function(card){
      card.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); card.click(); } });
    });
    wireBack(s);
  }

  /* ============ EX1 · a) mots en lien direct avec le sujet (tout début, structure l'exercice) ============ */
  function subjectReminderHTML(s){
    return '<div class="hint" style="font-size:13px;margin-bottom:12px;">Sujet central : <b style="color:var(--ink);">'+esc(s.subject||'—')+'</b></div>';
  }
  function encourageL1(count){
    if(count<=1) return "Bien, encore quelques mots pour structurer l'exploration.";
    if(count===2) return "Continue, encore 2 ou 3 mots idéalement.";
    if(count===3) return "Tu y es presque, encore 1 ou 2 pour arriver à 5.";
    if(count===4) return "Un dernier pour atteindre 5 !";
    return "5 mots, une belle base. Tu peux continuer ou passer à la suite.";
  }
  function viewEx1L1(s){
    var chips = s.ex1Branches.map(function(b,i){ return '<span class="chip">'+esc(b.name)+'<button type="button" data-rm-l1="'+i+'" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;margin-left:2px;font-size:15px;">×</button></span>'; }).join('');
    var guided = store.userLevel !== 'habitue';
    return '<div class="stage-label">Divergence · Exercice 1 — Exploration mentale</div>'
      + '<h1 class="title">Des éléments constitutifs ou structurels de ton sujet (3 à 5 mots)</h1>'
      + subjectReminderHTML(s)
      + (guided ? '<p class="lede">Caractéristiques, fonctions, usages, bénéfices, personnes… Un mot à la fois.</p>' : '')
      + '<div class="example-box">Exemple pour Parfum : flacon ou odeur</div>'
      + '<div class="card"><div class="input-row"><input type="text" id="f-l1-word" placeholder="un mot…" autofocus>'+micButton('f-l1-word')+'<button class="btn btn-primary" id="add-l1" style="flex:none;">Ajouter</button></div>'
      + (chips ? '<div class="chip-row" style="margin-top:14px;">'+chips+'</div>' : '')
      + (s.ex1Branches.length ? '<div style="margin-top:10px;"><span class="encourage">'+encourageL1(s.ex1Branches.length)+'</span></div>' : '')
      + '</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="next-l1" '+(s.ex1Branches.length?'':'disabled')+'>Suite →</button></div>';
  }
  function wireEx1L1(s){
    var input=document.getElementById('f-l1-word');
    input.focus();
    function addWord(){ var v=input.value.trim(); if(!v) return; s.ex1Branches.push({ id:uid(), name:v, leaves:[] }); input.value=''; persist(); }
    document.getElementById('add-l1').addEventListener('click', addWord);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addWord(); } });
    root.querySelectorAll('[data-rm-l1]').forEach(function(btn){ btn.addEventListener('click', function(){ s.ex1Branches.splice(parseInt(btn.getAttribute('data-rm-l1'),10),1); persist(); }); });
    var next=document.getElementById('next-l1');
    if(next) next.addEventListener('click', function(){
      s.stage = s.ex1WarmupDone ? 'ex1-l2' : 'ex1-warmup';
      if(s.stage==='ex1-l2') s.ex1FillPos=0;
      persist();
    });
    wireBack(s);
  }

  /* ============ EX1 · b) échauffement (2 mots, entre la structure et les évocations) ============ */
  var ENCOURAGE_WARMUP = [
    "Très bien, encore un autre mot qui te passe par la tête",
    "Très bien, continue comme ça",
    "Très bien, un dernier et c'est parti"
  ];
  var ENCOURAGE_NUDGE = [
    "💭 Pas grave du tout si rien ne vient — tu peux passer au mot suivant.",
    "💭 Aucun souci, tu peux sauter cette évocation si tu veux.",
    "💭 Rien ne t'oblige à rester ici, passe à la suite quand tu veux.",
    "💭 C'est ok de ne rien avoir pour ce mot — suivant si besoin."
  ];
  function encourageWarmupEvoc(count){
    if(count<=0) return '';
    if(count===1) return "Bien, encore un si tu veux, sinon tu peux continuer.";
    return "Parfait, tu peux passer à la suite.";
  }
  function viewEx1Warmup(s){
    if(!s.ex1WarmupWords || s.ex1WarmupWords.length!==2){
      s.ex1WarmupWords = shuffle(WARMUP_WORDS.slice()).slice(0,2);
      s.ex1WarmupPos = 0;
      s.ex1WarmupEvocations = [[],[]];
    }
    if(!s.ex1WarmupEvocations) s.ex1WarmupEvocations = [[],[]];
    var pos = s.ex1WarmupPos;
    var word = s.ex1WarmupWords[pos];
    var isLast = pos === s.ex1WarmupWords.length-1;
    var evocs = s.ex1WarmupEvocations[pos] || [];
    var chips = evocs.map(function(w,i){ return '<span class="chip">'+esc(w)+'<button type="button" data-rm-we="'+i+'" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;margin-left:2px;font-size:15px;">×</button></span>'; }).join('');
    return '<div class="stage-label">Divergence · Exercice 1 — échauffement '+(pos+1)+'/'+s.ex1WarmupWords.length+'</div>'
      + '<h1 class="title"><span class="stage-icon">'+iconSVG('warmup')+'</span>Un peu d\'échauffement...</h1>'
      + '<p class="lede">pour se mettre dans le bain.</p>'
      + '<div class="card">'
      + '<div style="font-size:30px;font-weight:600;text-align:center;margin-bottom:10px;">'+esc(word)+'</div>'
      + '<div style="text-align:center;"><div class="draw-sub">Donne 2 mots qui te viennent en lien avec ce mot — tu peux passer si rien ne vient.</div></div>'
      + '<div class="input-row"><input type="text" id="f-warmup" placeholder="un mot…" '+(evocs.length===0?'autofocus':'')+' '+(evocs.length>=2?'disabled':'')+'>'+micButton('f-warmup')+'<button class="btn btn-primary" id="add-warmup" style="flex:none;" '+(evocs.length>=2?'disabled':'')+'>Ajouter</button></div>'
      + (chips ? '<div class="chip-row" style="margin-top:14px;">'+chips+'</div>' : '')
      + (evocs.length ? '<div style="margin-top:10px;"><span class="encourage">'+encourageWarmupEvoc(evocs.length)+'</span></div>' : '')
      + '</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="warmup-next">'+(isLast?'C\'est parti !':'Suite →')+'</button></div>';
  }
  function wireEx1Warmup(s){
    var input = document.getElementById('f-warmup');
    if(input) input.focus();
    function addWord(){
      if(!input || input.disabled) return;
      var v = input.value.trim(); if(!v) return;
      var evocs = s.ex1WarmupEvocations[s.ex1WarmupPos];
      if(evocs.length>=2) return;
      evocs.push(v);
      persist();
    }
    if(input) input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addWord(); } });
    var addBtn = document.getElementById('add-warmup');
    if(addBtn) addBtn.addEventListener('click', addWord);
    root.querySelectorAll('[data-rm-we]').forEach(function(btn){
      btn.addEventListener('click', function(){
        s.ex1WarmupEvocations[s.ex1WarmupPos].splice(parseInt(btn.getAttribute('data-rm-we'),10),1);
        persist();
      });
    });
    document.getElementById('warmup-next').addEventListener('click', function(){
      if(s.ex1WarmupPos < s.ex1WarmupWords.length-1){ s.ex1WarmupPos++; }
      else { s.ex1WarmupDone=true; s.stage='ex1-l2'; s.ex1FillPos=0; }
      persist();
    });
    wireBack(s);
  }

  /* ============ EX1 · c) évocations de niveau 2, une branche à la fois ============ */
  function startDictate(s){
    var queue=[]; s.ex1Branches.forEach(function(b){ b.leaves.forEach(function(l){ queue.push(l.id); }); });
    if(!queue.length){ s.stage='hub'; persist(); return; }
    s.ex1DictateQueue=queue; s.ex1DictatePos=0; s.stage='ex1-dictate'; persist();
  }
  function findLeaf(s, leafId){
    for(var i=0;i<s.ex1Branches.length;i++) for(var j=0;j<s.ex1Branches[i].leaves.length;j++) if(s.ex1Branches[i].leaves[j].id===leafId) return { branch:s.ex1Branches[i], leaf:s.ex1Branches[i].leaves[j] };
    return null;
  }
  function encourageL2(count){
    if(count<=1) return "Bien, laisse venir encore une ou deux évocations.";
    if(count===2) return "Continue, encore une pour arriver à 3 ou 4.";
    return "Parfait, tu peux passer à la suite quand tu veux.";
  }
  function viewEx1L2(s){
    var pos=s.ex1FillPos, branch=s.ex1Branches[pos];
    if(!branch) return '';
    var chips = branch.leaves.map(function(l,i){ return '<span class="chip">'+esc(l.word)+'<button type="button" data-rm-l2="'+i+'" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;margin-left:2px;font-size:15px;">×</button></span>'; }).join('');
    return '<div class="stage-label">Divergence · Exercice 1 — évocations '+(pos+1)+'/'+s.ex1Branches.length+'</div>'
      + '<h1 class="title">Des évocations libres</h1>'
      + '<div class="card">'
      + '<div style="font-size:30px;font-weight:600;text-align:center;margin-bottom:10px;">'+esc(branch.name)+'</div>'
      + '<div style="text-align:center;"><div class="draw-sub">3 ou 4 évocations spontanées</div></div>'
      + '<div class="input-row"><input type="text" id="f-l2-word" placeholder="un mot…" autofocus>'+micButton('f-l2-word')+'<button class="btn btn-primary" id="add-l2" style="flex:none;">Ajouter</button></div>'
      + (chips ? '<div class="chip-row" style="margin-top:14px;">'+chips+'</div>' : '')
      + (branch.leaves.length ? '<div style="margin-top:10px;"><span class="encourage">'+encourageL2(branch.leaves.length)+'</span></div>' : '')
      + '<button type="button" class="btn btn-ghost" id="autofill-btn" style="margin-top:10px;">✨ Compléter automatiquement</button>'
      + '</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-ghost" id="finish-build">Terminer →</button><button class="btn btn-primary" id="fill-next">Suite →</button></div>';
  }
  function wireEx1L2(s){
    var branch = s.ex1Branches[s.ex1FillPos];
    if(!branch){ s.stage='hub'; persist(); return; }
    var input=document.getElementById('f-l2-word');
    input.focus();
    function addWord(){ var v=input.value.trim(); if(!v) return; branch.leaves.push({ id:uid(), word:v, ideas:[] }); input.value=''; persist(); }
    document.getElementById('add-l2').addEventListener('click', addWord);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addWord(); } });
    root.querySelectorAll('[data-rm-l2]').forEach(function(btn){ btn.addEventListener('click', function(){ branch.leaves.splice(parseInt(btn.getAttribute('data-rm-l2'),10),1); persist(); }); });
    document.getElementById('autofill-btn').addEventListener('click', async function(){
      var btn = this;
      var used = branch.leaves.map(function(l){ return l.word; });
      var needed = Math.max(0, 3-used.length);
      if(needed<=0) return;
      btn.disabled = true; var oldLabel = btn.textContent; btn.textContent = '✨ Recherche d\'idées…';
      var words = null;
      var sample = await getSample();
      if(sample){
        try{
          var allUsed = [];
          s.ex1Branches.forEach(function(b){ allUsed.push(b.name); b.leaves.forEach(function(l){ if(l.word) allUsed.push(l.word); }); });
          var usedUnique = allUsed.filter(function(w,i,arr){ return arr.map(function(x){return x.toLowerCase();}).indexOf(w.toLowerCase())===i; });
          var prompt = "Donne "+needed+" mots ou très courtes expressions en français, qui sont des associations libres et spontanées à partir du mot « "+branch.name+" » (pas du sujet global de la séance, juste de ce mot précis). "
            + "Évite absolument : le sujet central de la séance (« "+(s.subject||'')+" ») et ses synonymes, ainsi que tout mot déjà utilisé dans cette carte mentale ou ses synonymes ("+usedUnique.join(', ')+"). "
            + "Réponds uniquement avec les mots séparés par des virgules, sans numérotation, sans phrase, sans explication.";
          var resultText = '';
          await sample(prompt, { onText:function(ev){ resultText = ev.text; } });
          words = resultText.split(',').map(function(w){ return w.trim().replace(/^[-•\d.\s]+/,'').replace(/\.$/,''); }).filter(Boolean);
          var bannedLower = usedUnique.map(function(w){return w.toLowerCase();}).concat([(s.subject||'').toLowerCase(), branch.name.toLowerCase()]);
          words = words.filter(function(w){ return bannedLower.indexOf(w.toLowerCase())===-1; });
        }catch(e){ words = null; }
      }
      if(!words || !words.length){
        var pool = shuffle(AUTO_FILL_HINTS.filter(function(h){ return used.indexOf(h)===-1; }));
        words = pool.slice(0, needed);
      }
      words.slice(0, needed).forEach(function(w){ branch.leaves.push({ id:uid(), word:w, ideas:[] }); });
      persist();
    });
    document.getElementById('fill-next').addEventListener('click', function(){
      if(s.ex1FillPos === s.ex1Branches.length-1){ startDictate(s); }
      else { s.ex1FillPos++; persist(); }
    });
    document.getElementById('finish-build').addEventListener('click', function(){ startDictate(s); });
    wireBack(s);
  }

  /* ============ EX1 · d) idées, une évocation à la fois — sans mind map ============ */
  function viewEx1Dictate(s){
    if(s.ex1DictatePos >= s.ex1DictateQueue.length) return '';
    var leafId = s.ex1DictateQueue[s.ex1DictatePos];
    var found = findLeaf(s, leafId);
    var ideasSoFar = found ? found.leaf.ideas.map(function(i){ return '<div class="entry">'+esc(i.text)+'</div>'; }).join('') : '';
    return '<div class="stage-label" id="dictate-stagelabel">Divergence · Exercice 1 — idée '+(s.ex1DictatePos+1)+'/'+s.ex1DictateQueue.length+'</div>'
      + '<h1 class="title">À toi d\'imaginer</h1>'
      + '<p class="lede" id="dictate-sub">à l\'évocation de ce mot, que pourrait-on imaginer pour réinventer <b>'+esc(s.subject||'ton sujet')+'</b> ?</p>'
      + '<div class="card">'
      + '<div id="dictate-heading" style="font-size:30px;font-weight:600;text-align:center;margin-bottom:10px;">'+(found?esc(found.leaf.word):'…')+'</div>'
      + '<div class="question-reminder">'+esc(s.question)+'</div>'
      + '<div class="input-row"><textarea id="f-dictate" rows="2" placeholder="Dis ou écris une idée, puis Entrée…" autofocus></textarea>'+micButton('f-dictate')+'</div>'
      + '<div class="hint" style="margin-bottom:10px;">Appuie sur Entrée pour ajouter l\'idée et continuer sur ce mot.</div>'
      + '<div class="nudge" id="dictate-nudge" style="display:none;"></div>'
      + '<div class="idea-log" id="dictate-idealog">'+ideasSoFar+'</div>'
      + '</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="dictate-next">Passer au mot suivant →</button></div>';
  }
  function wireEx1Dictate(s){
    if(s.ex1DictatePos >= s.ex1DictateQueue.length){ s.stage='hub'; persist(); return; }
    var ta = document.getElementById('f-dictate');
    ta.focus();

    var nudgeHandle = null;
    function clearNudge(){ clearTimeout(nudgeHandle); var n=document.getElementById('dictate-nudge'); if(n) n.style.display='none'; }
    function armNudge(){
      clearNudge();
      nudgeHandle = setTimeout(function(){
        var n=document.getElementById('dictate-nudge');
        if(n){ n.textContent = ENCOURAGE_NUDGE[s.ex1DictatePos % ENCOURAGE_NUDGE.length]; n.style.display='block'; }
      }, 8000);
    }
    ta.addEventListener('input', function(){ if(ta.value.trim()) clearNudge(); else armNudge(); });
    armNudge();

    function refreshLog(found){ document.getElementById('dictate-idealog').innerHTML = found.leaf.ideas.map(function(i){ return '<div class="entry">'+esc(i.text)+'</div>'; }).join(''); }

    function submitIdea(){
      var leafId = s.ex1DictateQueue[s.ex1DictatePos]; var found = findLeaf(s, leafId);
      var txt = ta.value.trim(); if(!txt || !found) return;
      txt.split('\n').map(function(t){return t.trim();}).filter(Boolean).forEach(function(t){ found.leaf.ideas.push({ id:uid(), text:t, keep:true }); });
      ta.value=''; refreshLog(found); saveStore(); armNudge();
    }
    ta.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitIdea(); } });

    function goTo(newPos){
      clearNudge();
      var leafIdOld = s.ex1DictateQueue[s.ex1DictatePos];
      var foundOld = findLeaf(s, leafIdOld);
      if(foundOld && ta.value.trim()){
        ta.value.split('\n').map(function(t){return t.trim();}).filter(Boolean).forEach(function(t){ foundOld.leaf.ideas.push({ id:uid(), text:t, keep:true }); });
      }
      stopActiveRec(); saveStore();
      if(newPos<0){ s.stage='ex1-l2'; s.ex1FillPos=Math.max(0,s.ex1Branches.length-1); persist(); return; }
      s.ex1DictatePos=newPos; persist();
    }

    document.getElementById('dictate-next').addEventListener('click', function(){ goTo(s.ex1DictatePos+1); });
    var backBtn=document.getElementById('back-btn'); if(backBtn) backBtn.addEventListener('click', function(){ goTo(s.ex1DictatePos-1); });
  }

  /* ============ EX2 · Hasards féconds (cartes) ============ */
  function viewCards(s){
    if(!s.deck) s.deck = shuffle(WORD_BANK.slice());
    var deckLen=s.deck.length; var layers=Math.min(3,Math.max(0,deckLen-1));
    var backLayers=''; for(var i=0;i<layers;i++) backLayers+='<div class="deck-back"></div>';
    var flipped = s.drawnWord ? 'flipped' : '';
    var deckArea = '<div class="deck-area"><div class="deck-stack" id="deck-stack" role="button" tabindex="0">'+backLayers
      + '<div class="deck-top '+flipped+'" id="deck-top"><div class="deck-top-inner">'
      + '<div class="deck-face deck-face-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5z"/></svg></div>'
      + '<div class="deck-face deck-face-front" id="deck-front-text">'+esc(s.drawnWord||'')+'</div></div></div></div>'
      + '<div class="deck-count">'+(deckLen>0?deckLen+' carte'+(deckLen>1?'s':'')+' restante'+(deckLen>1?'s':'')+' — clique sur la carte':'toutes les cartes ont été tirées')+'</div></div>';
    var actionArea = '';
    if(s.drawnWord){
      actionArea = '<div class="draw-panel"><div class="draw-sub">Une idée spontanée en lien avec « '+esc(s.drawnWord)+' » ?</div>'
        + '<div class="input-row"><textarea id="f-card-idea" rows="2" placeholder="Écris ou dicte, puis Entrée…" autofocus></textarea>'+micButton('f-card-idea')+'</div>'
        + '<div class="hint" style="text-align:center;">Entrée pour garder l\'idée · reclique sur la carte pour en tirer une autre</div></div>';
    }
    var log = s.cardIdeas.length ? '<div class="idea-log">'+s.cardIdeas.map(function(c){ return '<div class="entry"><span class="w">'+esc(c.word)+'</span> — '+esc(c.idea)+'</div>'; }).join('')+'</div>' : '';
    return '<div class="stage-label">Divergence · Exercice 2 — Hasards féconds</div>'
      + '<h1 class="title">Pioche des mots inspirants</h1>'
      + '<p class="lede">Clique sur la carte pour la battre et la retourner, note la première idée qui te traverse l\'esprit — et reclique pour recommencer autant de fois que tu veux.</p>'
      + '<div class="card"><div class="question-reminder">'+esc(s.question)+'</div>'+deckArea+actionArea+log+'</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="next-cards">Retour hub exercices créatifs →</button></div>';
  }
  function wireCards(s){
    if(!s.deck) s.deck = shuffle(WORD_BANK.slice());
    function commitPending(){
      var ta=document.getElementById('f-card-idea');
      if(ta && ta.value.trim() && s.drawnWord){ s.cardIdeas.push({ id:uid(), word:s.drawnWord, idea:ta.value.trim() }); ta.value=''; }
    }
    function performDraw(){
      var stack=document.getElementById('deck-stack'), top=document.getElementById('deck-top');
      if(!s.deck.length){ persist(); return; }
      stack.classList.add('shuffling');
      setTimeout(function(){
        stack.classList.remove('shuffling');
        if(s.deck.length>1 && s.deck[0]===s.lastCardWord){
          var swapIdx=1+Math.floor(Math.random()*(s.deck.length-1));
          var tmp=s.deck[0]; s.deck[0]=s.deck[swapIdx]; s.deck[swapIdx]=tmp;
        }
        var word=s.deck.shift(); s.lastCardWord=word;
        document.getElementById('deck-front-text').textContent=word; top.classList.add('flipped');
        setTimeout(function(){ s.drawnWord=word; persist(); }, 560);
      }, 620);
    }
    var stackEl = document.getElementById('deck-stack');
    if(stackEl) stackEl.addEventListener('click', function(){
      commitPending();
      s.drawnWord=null;
      performDraw();
    });
    if(stackEl) stackEl.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); stackEl.click(); } });
    var ta = document.getElementById('f-card-idea');
    if(ta) ta.focus();
    if(ta) ta.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        var txt=ta.value.trim(); if(!txt) return;
        s.cardIdeas.push({ id:uid(), word:s.drawnWord, idea:txt }); ta.value='';
        saveStore();
        var log=document.querySelector('.idea-log');
        var full = s.cardIdeas.map(function(c){ return '<div class="entry"><span class="w">'+esc(c.word)+'</span> — '+esc(c.idea)+'</div>'; }).join('');
        if(log) log.innerHTML = full; else { var card=document.querySelector('.card'); if(card){ var d=document.createElement('div'); d.className='idea-log'; d.innerHTML=full; card.appendChild(d); } }
      }
    });
    document.getElementById('next-cards').addEventListener('click', function(){ commitPending(); s.stage='hub'; persist(); });
    if(cardsAutoDraw){ cardsAutoDraw=false; performDraw(); }
    wireBack(s);
  }

  /* ============ EX3 · Refonte du présent (roue) ============ */
  function wheelSVG(items, picked, showLabels){
    var n=items.length, cx=150, cy=150, r=145, seg=2*Math.PI/n, paths='', labels='';
    for(var i=0;i<n;i++){
      var a0=i*seg-Math.PI/2, a1=(i+1)*seg-Math.PI/2;
      var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      var large=seg>Math.PI?1:0; var isPicked=picked.indexOf(items[i])>-1;
      var fill=isPicked?'var(--spark-soft)':(i%2===0?'var(--card)':'var(--paper-2)'); var stroke=isPicked?'var(--spark)':'var(--line)';
      paths += '<path data-seg-idx="'+i+'" d="M'+cx+','+cy+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>';
      if(showLabels){
        var mid=a0+seg/2, lx=cx+(r*0.62)*Math.cos(mid), ly=cy+(r*0.62)*Math.sin(mid), rot=(mid*180/Math.PI)+90;
        labels += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" transform="rotate('+rot.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')" text-anchor="middle" fill="'+(isPicked?'var(--spark-contrast)':'var(--ink)')+'" font-size="11" font-weight="600">'+esc(items[i])+'</text>';
      }
    }
    return '<svg viewBox="0 0 300 300">'+paths+labels+'<circle cx="150" cy="150" r="20" fill="var(--ink)"/></svg>';
  }
  function viewEx3Wheel(s){
    if(!s.wheelOrder) s.wheelOrder = shuffle(SECTORS.slice());
    var items=s.wheelOrder; var allDrawn = s.wheelDraws.length>=items.length;
    var panel;
    if(s.wheelDrawnName){
      var q = SECTOR_QUESTION[s.wheelDrawnName] || 'Une idée spontanée ?';
      var ideasHere = s.wheelIdeas.filter(function(w){ return w.dimension===s.wheelDrawnName; });
      panel = '<div class="draw-panel"><div class="draw-sub"><b style="color:var(--ink);">'+esc(s.wheelDrawnName)+'</b><br>'+esc(q)+'</div>'
        + '<div class="input-row"><textarea id="f-wheel-idea" rows="2" placeholder="Écris ou dicte, puis Entrée…" autofocus></textarea>'+micButton('f-wheel-idea')+'</div>'
        + '<div class="hint" style="text-align:center;">Entrée pour garder l\'idée · reclique sur la roue pour tourner à nouveau</div>'
        + '<div class="nudge" id="wheel-nudge" style="display:none;"></div>'
        + '<div class="idea-log" id="wheel-current-log">'+ideasHere.map(function(w){ return '<div class="entry">'+esc(w.idea)+'</div>'; }).join('')+'</div></div>';
    } else if(!allDrawn){
      panel = '<div class="hint" style="text-align:center;margin-top:10px;">Clique sur la roue pour la lancer</div>';
    } else { panel = '<div class="empty">Tous les secteurs ont été tirés.</div>'; }
    var log = s.wheelIdeas.length ? '<div class="idea-log">'+s.wheelIdeas.map(function(w){ return '<div class="entry"><span class="w">'+esc(w.dimension)+'</span> — '+esc(w.idea)+'</div>'; }).join('')+'</div>' : '';
    return '<div class="stage-label">Divergence · Exercice 3 — Refonte du présent</div>'
      + '<h1 class="title">Lance la roue</h1>'
      + '<p class="lede">et obtiens un angle pour repenser ton sujet. Il n\'y a pas d\'idée stupide. Donne tout ce qui te vient à l\'esprit.</p>'
      + '<div class="card wheel-wrap"><div class="question-reminder" style="align-self:stretch;">'+esc(s.question)+'</div>'
      + '<div class="wheel-shell" id="wheel-shell-click" role="button" tabindex="0"><div class="wheel-pointer"></div><div class="wheel-disc" id="wheel-disc" style="transform:rotate('+(s.wheelRotation||0)+'deg)">'+wheelSVG(items,s.wheelDraws,false)+'</div></div>'
      + panel + log
      + '</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="next-wheel3">Retour hub exercices créatifs →</button></div>';
  }
  var ENCOURAGE_WHEEL_NUDGE = [
    "💭 Tu ne trouves rien ? Pas grave, relance la roue.",
    "💭 Rien ne vient ? Aucun souci, tu peux relancer la roue.",
    "💭 Pas d'inspiration là ? Pas grave du tout, relance la roue quand tu veux.",
    "💭 Ce n'est pas grave si rien ne sort — relance la roue et passe à autre chose."
  ];
  function wireEx3Wheel(s){
    var disc=document.getElementById('wheel-disc');
    function commitPending(){
      var ta=document.getElementById('f-wheel-idea');
      if(ta && ta.value.trim() && s.wheelDrawnName){ s.wheelIdeas.push({ id:uid(), dimension:s.wheelDrawnName, idea:ta.value.trim() }); ta.value=''; }
    }
    function performSpin(){
      var items=s.wheelOrder, n=items.length;
      var eligible=[]; for(var i=0;i<n;i++){ if(s.wheelDraws.indexOf(items[i])===-1) eligible.push(i); }
      if(!eligible.length){ persist(); return; }
      var idx=eligible[Math.floor(Math.random()*eligible.length)]; var seg=360/n;
      var currentRot=s.wheelRotation||0; var targetWithinTurn=360-(idx*seg+seg/2); var base=Math.floor(currentRot/360)*360;
      var newRotation=base+4*360+targetWithinTurn; while(newRotation<=currentRot) newRotation+=360;
      disc.classList.add('spinning');
      requestAnimationFrame(function(){ disc.style.transform='rotate('+newRotation+'deg)'; });
      setTimeout(function(){
        disc.classList.remove('spinning'); s.wheelRotation=newRotation; s.wheelDraws.push(items[idx]); s.wheelDrawnName=items[idx]; persist();
        setTimeout(function(){ var seg2=root.querySelector('[data-seg-idx="'+idx+'"]'); if(seg2){ seg2.classList.add('just-picked'); setTimeout(function(){ seg2.classList.remove('just-picked'); },1200); } }, 30);
      }, 3300);
    }
    var shell = document.getElementById('wheel-shell-click');
    if(shell) shell.addEventListener('click', function(){
      commitPending();
      s.wheelDrawnName=null;
      performSpin();
    });
    if(shell) shell.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); shell.click(); } });
    var ta = document.getElementById('f-wheel-idea');
    if(ta) ta.focus();
    if(ta){
      var wheelNudgeHandle = null;
      function clearWheelNudge(){ clearTimeout(wheelNudgeHandle); var n=document.getElementById('wheel-nudge'); if(n) n.style.display='none'; }
      function armWheelNudge(){
        clearWheelNudge();
        wheelNudgeHandle = setTimeout(function(){
          var n=document.getElementById('wheel-nudge');
          if(n){ n.textContent = ENCOURAGE_WHEEL_NUDGE[Math.floor(Math.random()*ENCOURAGE_WHEEL_NUDGE.length)]; n.style.display='block'; }
        }, 8000);
      }
      ta.addEventListener('input', function(){ if(ta.value.trim()) clearWheelNudge(); else armWheelNudge(); });
      armWheelNudge();
    }
    if(ta) ta.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        var txt=ta.value.trim(); if(!txt) return;
        s.wheelIdeas.push({ id:uid(), dimension:s.wheelDrawnName, idea:txt }); ta.value='';
        saveStore();
        var curLog=document.getElementById('wheel-current-log');
        if(curLog) curLog.innerHTML = s.wheelIdeas.filter(function(w){ return w.dimension===s.wheelDrawnName; }).map(function(w){ return '<div class="entry">'+esc(w.idea)+'</div>'; }).join('');
        var fullLog=document.querySelectorAll('.idea-log');
        if(fullLog.length>1) fullLog[fullLog.length-1].innerHTML = s.wheelIdeas.map(function(w){ return '<div class="entry"><span class="w">'+esc(w.dimension)+'</span> — '+esc(w.idea)+'</div>'; }).join('');
      }
    });
    document.getElementById('next-wheel3').addEventListener('click', function(){ commitPending(); s.stage='hub'; persist(); });
    if(wheelAutoSpin){ wheelAutoSpin=false; performSpin(); }
    wireBack(s);
  }

  /* ============ CONVERGENCE ============ */
  function allIdeas(s){
    var out=[];
    s.ex1Branches.forEach(function(b){ b.leaves.forEach(function(l){ l.ideas.forEach(function(i){ out.push({ id:i.id, text:i.text, src:'Exploration mentale — '+b.name+' → '+l.word, ref:i }); }); }); });
    s.cardIdeas.forEach(function(c){ out.push({ id:c.id, text:c.idea, src:'Hasards féconds — '+c.word, ref:c }); });
    s.wheelIdeas.forEach(function(w){ out.push({ id:w.id, text:w.idea, src:'Refonte du présent — '+w.dimension, ref:w }); });
    return out;
  }
  function viewConvergence(s){
    var ideas = allIdeas(s);
    if(!ideas.length){
      return '<div class="stage-label">Phase 2 · Convergence</div><h1 class="title">Pas encore d\'idées</h1><p class="lede">Retourne à l\'atelier pour en récolter quelques-unes.</p><div class="bottombar">'+backButtonHTML()+'</div>';
    }
    var html = '<div class="debrief-group">' + ideas.map(function(i){
      var kept = i.ref.keep!==false;
      return '<div class="debrief-row'+(kept?' kept':'')+'" data-keep="'+i.id+'" role="button" tabindex="0"><span class="mark"></span><div class="txt">'+esc(i.text)+'</div></div>';
    }).join('') + '</div>';
    return '<div class="stage-label">Phase 2 · Convergence</div>'
      + '<h1 class="title">Voici toutes les idées émises !</h1>'
      + '<p class="lede">Décoche ce que finalement tu vas mettre de côté, au moins pour l\'instant.</p>'
      + '<div class="card">'+html+'</div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-primary" id="next-convergence">Voir la synthèse →</button></div>';
  }
  function wireConvergence(s){
    root.querySelectorAll('[data-keep]').forEach(function(row){
      function toggle(){
        var id=row.getAttribute('data-keep'); var found=allIdeas(s).find(function(i){return i.id===id;});
        if(!found) return;
        found.ref.keep = found.ref.keep===false;
        row.classList.toggle('kept', found.ref.keep);
        saveStore();
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    });
    var next=document.getElementById('next-convergence'); if(next) next.addEventListener('click', function(){ s.stage='synthesis'; persist(); });
    wireBack(s);
  }

  /* ============ SYNTHÈSE ============ */
  function viewSynthesis(s){
    var all = allIdeas(s);
    var kept = all.filter(function(i){ return i.ref.keep!==false; });
    var discarded = all.filter(function(i){ return i.ref.keep===false; });
    var html = kept.length ? '<div class="synth-col">' + kept.map(function(i){ return '<div class="synth-bullet">'+esc(i.text)+'</div>'; }).join('') + '</div>'
      : '<div class="empty">Aucune idée conservée. Retourne à la convergence pour en garder quelques-unes.</div>';
    if(discarded.length){
      html += '<div class="synth-col" style="margin-top:18px;"><h3>Autres idées non développées</h3>'
        + discarded.map(function(i){ return '<div class="synth-bullet">'+esc(i.text)+'</div>'; }).join('') + '</div>';
    }
    return '<div class="stage-label">Phase 3 · Synthèse</div>'
      + '<h1 class="title">Voici les meilleures idées !</h1>'
      + '<p class="lede">Voici les idées gardées. Tu peux ensuite demander à l\'IA de les prolonger.</p>'
      + '<div class="card">'+html+'</div>'
      + '<div class="ai-box"><div class="lbl">Aller plus loin avec l\'IA</div>'
      + '<button class="btn btn-spark" id="ai-go" '+(kept.length?'':'disabled')+'>Faire émerger des pistes de concept</button>'
      + '<div id="ai-output" class="ai-out"></div></div>'
      + '<div class="bottombar">'+backButtonHTML()+'<span class="spacer"></span><button class="btn btn-ghost" id="share-btn"><span class="stage-icon" style="vertical-align:-3px;margin-right:2px;">'+iconSVG('share',18)+'</span>Partager</button><button class="btn btn-ghost" id="dl-btn">Télécharger</button><button class="btn btn-ghost" id="new-from-synth">Nouvelle séance</button></div>';
  }
  function getAiConceptsText(){
    var out = document.getElementById('ai-output');
    if(!out) return '';
    var t = out.textContent.trim();
    if(!t || t.indexOf('Réflexion en cours')>-1 || t.indexOf("n'est pas disponible")>-1 || t.indexOf('Une erreur est survenue')>-1) return '';
    return t;
  }
  function buildSynthesisText(s){
    var all = allIdeas(s);
    var kept = all.filter(function(i){ return i.ref.keep!==false; });
    var discarded = all.filter(function(i){ return i.ref.keep===false; });
    var out = (s.question||'Synthèse')+'\n\n';
    out += kept.length ? kept.map(function(i){ return '- '+i.text; }).join('\n') : '(aucune idée retenue)';
    if(discarded.length){
      out += '\n\nAutres idées non développées :\n' + discarded.map(function(i){ return '- '+i.text; }).join('\n');
    }
    var aiText = getAiConceptsText();
    if(aiText){ out += '\n\nPistes de concept (IA) :\n' + aiText; }
    return out;
  }
  function buildSynthesisHTML(s){
    var all = allIdeas(s);
    var kept = all.filter(function(i){ return i.ref.keep!==false; });
    var discarded = all.filter(function(i){ return i.ref.keep===false; });
    var aiText = getAiConceptsText();
    var html = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Synthèse — Étincelle</title>'
      + '<style>body{font-family:Georgia,\'Times New Roman\',serif;max-width:680px;margin:36px auto;padding:0 24px;color:#161616;}'
      + 'h1{font-size:21px;margin-bottom:4px;} .brand{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.04em;color:#888;text-transform:uppercase;margin-bottom:10px;}'
      + 'h2{font-size:15px;margin:26px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px;}'
      + 'ul{padding-left:20px;margin:0;} li{margin-bottom:7px;line-height:1.45;}'
      + '.ai{white-space:pre-wrap;line-height:1.55;}'
      + '@media print{ body{margin:0 auto;} }</style></head><body>'
      + '<div class="brand">✦ Étincelle</div>'
      + '<h1>'+esc(s.question||'Synthèse')+'</h1>'
      + '<h2>Idées retenues</h2>'
      + (kept.length ? '<ul>'+kept.map(function(i){ return '<li>'+esc(i.text)+'</li>'; }).join('')+'</ul>' : '<p>(aucune idée retenue)</p>');
    if(discarded.length){
      html += '<h2>Autres idées non développées</h2><ul>'+discarded.map(function(i){ return '<li>'+esc(i.text)+'</li>'; }).join('')+'</ul>';
    }
    if(aiText){ html += '<h2>Pistes de concept (IA)</h2><p class="ai">'+esc(aiText)+'</p>'; }
    html += '</body></html>';
    return html;
  }
  function wireSynthesis(s){
    var shareBtn=document.getElementById('share-btn');
    if(shareBtn) shareBtn.addEventListener('click', async function(){
      var text = buildSynthesisText(s);
      var sharedOk = false;
      if(navigator.share){
        try{ await navigator.share({ title:'Étincelle — synthèse', text:text }); sharedOk = true; }
        catch(e){ if(e && e.name==='AbortError') sharedOk = true; /* user cancelled on purpose, don't fall back */ }
      }
      if(sharedOk) return;
      var subject=encodeURIComponent('Étincelle — synthèse : '+(s.question||''));
      var body=encodeURIComponent(text);
      var mailtoUrl='mailto:?subject='+subject+'&body='+body;
      var opened=null;
      try{ opened=window.open(mailtoUrl,'_blank'); }catch(e){ opened=null; }
      var copied=false;
      try{ await navigator.clipboard.writeText(text); copied=true; }catch(e){ copied=false; }
      if(!opened){
        alert(copied ? "Impossible d'ouvrir directement ta messagerie ici — la synthèse a été copiée dans le presse-papiers, tu peux la coller où tu veux (mail, SMS…)." : "Impossible de partager automatiquement ici. Voici le texte à copier toi-même :\n\n"+text);
      }
    });
    var aiBtn=document.getElementById('ai-go');
    if(aiBtn) aiBtn.addEventListener('click', async function(){
      var out=document.getElementById('ai-output'); var ideas=allIdeas(s).filter(function(i){ return i.ref.keep!==false; });
      var sample=await getSample();
      if(!sample){ out.textContent="La fonction IA n'est pas disponible dans ce contexte. Tu peux copier tes idées et les explorer ailleurs."; return; }
      aiBtn.disabled=true; out.textContent='Réflexion en cours…';
      var listTxt = ideas.map(function(i){ return '- ('+i.src+') '+i.text; }).join('\n');
      var prompt = "Voici une séance de brainstorming en français sur la question : \""+s.question+"\".\n\nIdées retenues :\n"+listTxt
        + "\n\nEn t'appuyant uniquement sur ces idées, propose 3 pistes de concept distinctes et concrètes qui pourraient en émerger, chacune en 2-3 phrases, avec un nom court et évocateur pour chaque piste. Réponds en français, dans un ton direct et inspirant, sans jargon.";
      try{ await sample(prompt, { onText:function(ev){ out.textContent=ev.text; } }); }
      catch(e){ out.textContent="Une erreur est survenue pendant la génération. Réessaie dans un instant."; }
      aiBtn.disabled=false;
    });
    var dl=document.getElementById('dl-btn');
    if(dl) dl.addEventListener('click', async function(){
      var html = buildSynthesisHTML(s);
      var w = null;
      try{ w = window.open('', '_blank'); }catch(e){ w = null; }
      if(w){
        try{
          w.document.open(); w.document.write(html); w.document.close();
          setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 350);
          return;
        }catch(e){}
      }
      var text = buildSynthesisText(s);
      try{ await navigator.clipboard.writeText(text); alert("Impossible d'ouvrir l'aperçu PDF ici (fenêtres bloquées) — la synthèse a été copiée dans le presse-papiers."); }
      catch(e){ alert('Impossible de générer le PDF ou de copier automatiquement. Voici le texte à copier toi-même :\n\n'+text); }
    });
    var nw=document.getElementById('new-from-synth'); if(nw) nw.addEventListener('click', function(){ stopActiveRec(); store.currentId=null; saveStore(); renderLevelSelect(); });
    wireBack(s);
  }

  /* ============ INIT ============ */
  render();
})();
</script>
